<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Focus Board</title>
	<style>
		:root {
			--ink: #17221b;
			--muted: #718078;
			--paper: #f5f4ee;
			--panel: #ffffff;
			--line: #dce3dc;
			--mint: #c8f169;
			--coral: #ff795f;
			--blue: #a9dcff;
			--shadow: 0 18px 45px rgba(23, 34, 27, .09);
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			color: var(--ink);
			background: var(--paper);
			font-family: Georgia, "Times New Roman", serif;
		}

		.shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
		header { display: flex; align-items: center; justify-content: space-between; padding: 28px 0 42px; }
		.brand { display: flex; align-items: center; gap: 12px; font-size: 1.25rem; font-weight: bold; }
		.brand-mark { width: 17px; height: 17px; background: var(--coral); border-radius: 50%; box-shadow: 8px 0 0 var(--mint); }
		.date { color: var(--muted); font: 600 .75rem/1.2 Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
		main { padding-bottom: 64px; }
		.intro { display: grid; grid-template-columns: 1.4fr 1fr; align-items: end; gap: 40px; margin-bottom: 34px; }
		h1 { max-width: 620px; margin: 0; font-size: clamp(2.8rem, 7vw, 6rem); line-height: .92; letter-spacing: -.04em; }
		.intro p { max-width: 300px; margin: 0 0 7px; color: var(--muted); font: 1rem/1.6 Arial, sans-serif; }
		.grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 18px; }
		.panel { background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
		.hero-panel { min-height: 360px; padding: 34px; background: var(--mint); display: flex; flex-direction: column; justify-content: space-between; }
		.eyebrow { font: 700 .7rem/1 Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
		.hero-panel h2 { max-width: 470px; margin: 24px 0 0; font-size: clamp(2rem, 4vw, 3.5rem); line-height: .98; letter-spacing: -.03em; }
		.hero-foot { display: flex; justify-content: space-between; align-items: end; gap: 20px; font: 700 .8rem/1.4 Arial, sans-serif; }
		.complete-button { align-self: start; padding: 11px 15px; color: var(--paper); background: var(--ink); border: 0; cursor: pointer; font: 700 .72rem Arial, sans-serif; text-transform: uppercase; letter-spacing: .08em; }
		.complete-button:hover { background: var(--coral); }
		.progress { width: 130px; height: 8px; background: rgba(23, 34, 27, .15); }
		.progress span { display: block; width: 68%; height: 100%; background: var(--ink); }
		.side-stack { display: grid; gap: 18px; }
		.stat-panel { padding: 28px; background: var(--blue); }
		.stat { margin: 20px 0 5px; font-size: 4.8rem; line-height: .8; letter-spacing: -.08em; }
		.stat-label { font: 700 .78rem/1.3 Arial, sans-serif; }
		.list-panel { padding: 28px; }
		.list-panel h3 { margin: 0 0 20px; font-size: 1.5rem; }
		.task { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font: .88rem/1.3 Arial, sans-serif; }
		.task:last-child { padding-bottom: 0; }
		.task-dot { width: 10px; height: 10px; flex: 0 0 auto; border: 2px solid var(--coral); border-radius: 50%; }
		@media (max-width: 700px) {
			.shell { width: min(100% - 28px, 560px); }
			header { padding: 20px 0 34px; }
			.intro, .grid { grid-template-columns: 1fr; }
			.intro { gap: 20px; }
			.hero-panel { min-height: 320px; }
		}
	</style>
</head>
<body>
	<div class="shell">
		<header>
			<div class="brand"><span class="brand-mark" aria-hidden="true"></span> Focus Board</div>
			<div class="date">Monday / 01 April 2024</div>
		</header>
		<main>
			<section class="intro">
				<h1>Make space<br>for good work.</h1>
				<p>A small, quiet dashboard for keeping today visible and moving one meaningful task forward.</p>
			</section>
			<section class="grid" aria-label="Daily focus overview">
				<article class="panel hero-panel">
					<div>
						<div class="eyebrow">Today's focus</div>
						<h2 id="focus-title">Ship the first thoughtful version.</h2>
						<button class="complete-button" id="focus-button" type="button">Complete focus</button>
					</div>
					<div class="hero-foot"><span>2 of 3 milestones complete</span><span class="progress" aria-label="68 percent complete"><span></span></span></div>
				</article>
				<div class="side-stack">
					<article class="panel stat-panel">
						<div class="eyebrow">Deep work streak</div>
						<div class="stat">04</div>
						<div class="stat-label">days in a row</div>
					</article>
					<article class="panel list-panel" aria-labelledby="next-up-title">
						<h3 id="next-up-title">Next up</h3>
						<button class="task" type="button"><span class="task-dot" aria-hidden="true"></span>Review the opening notes</button>
						<button class="task" type="button"><span class="task-dot" aria-hidden="true"></span>Share the working draft</button>
						<button class="task" type="button"><span class="task-dot" aria-hidden="true"></span>Take a real break</button>
					</article>
				</div>
			</section>
		</main>
	</div>
	<script>
		const tasks = [...document.querySelectorAll('.task')];
		const focusButton = document.querySelector('#focus-button');
		const focusTitle = document.querySelector('#focus-title');
		const progressText = document.querySelector('.hero-foot span');

		function updateProgress() {
			const completed = tasks.filter(task => task.dataset.complete === 'true').length;
			progressText.textContent = `${completed} of ${tasks.length} tasks complete`;
		}

		tasks.forEach(task => {
			task.addEventListener('click', () => {
				const complete = task.dataset.complete === 'true';
				task.dataset.complete = String(!complete);
				task.querySelector('.task-dot').style.background = complete ? 'transparent' : 'var(--coral)';
				task.style.textDecoration = complete ? 'none' : 'line-through';
				updateProgress();
			});
		});

		focusButton.addEventListener('click', () => {
			focusTitle.textContent = 'A thoughtful version is shipped.';
			focusButton.textContent = 'Focus complete';
			focusButton.disabled = true;
			focusButton.style.opacity = '.6';
		});
	</script>
</body>
</html>
